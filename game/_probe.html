<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>probe</title></head>
<body>
<pre id="out">building…</pre>
<script type="module">
import * as THREE from './vendor/three.module.min.js';
import { City } from './src/city.js';

const log = [];
try {
  const t0 = performance.now();
  const city = new City(1, null);
  const t1 = performance.now();
  let verts = 0;
  const names = [];
  city.group.traverse((o) => {
    if (o.geometry && o.geometry.getAttribute('position')) verts += o.geometry.getAttribute('position').count;
  });
  for (const c of city.group.children) names.push(`${c.name || c.type}:${c.geometry ? c.geometry.getAttribute('position').count : '-'}`);
  log.push(JSON.stringify({ buildMs: Math.round(t1 - t0), stats: city.stats(), objects: city.group.children.length, verts, names }, null, 1));
  // one frame of per-frame work, to time the lamp pool + traffic
  const t2 = performance.now();
  for (let i = 0; i < 200; i++) city.update(1 / 60, new THREE.Vector3(10, 0, 10));
  log.push('update x200 ms: ' + Math.round(performance.now() - t2));
} catch (err) {
  log.push('ERROR ' + err.stack);
}
document.getElementById('out').textContent = log.join('\n');
document.title = 'probe-done';
</script>
</body>
</html>
